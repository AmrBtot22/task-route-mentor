<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/all.css">
</head>
<body>
    <div class="offer-card">
  <div class="img-container card-header">
    <img src="./imgs/image-equilibrium.jpg" alt="NFT Equilibrium" />
  </div>

  <div class="card-body">
    <h4 class="card-title">Equilibrium #3429</h4>
    <p class="card-desc">
      Our Equilibrium collection promotes balance and calm.
    </p>

    <div class="offer-details">
      <div class="price-wrapper">
        <img src="./imgs/icons/icon-ethereum.svg"/>
        <span>0.041 ETH</span>
      </div>
      <div class="time-wrapper">
        <img src="./imgs/icons/icon-clock.svg"/>
        <span>3 days left</span>
      </div>
    </div>
  </div>

  <div class="card-footer">
    <div class="avatar-container">
      <img src="./imgs/image-avatar.png" alt="Avatar" />
    </div>
    <p class="creator-info">
      Creation of <span class="creator-name">Jules Wyvern</span>
    </p>
  </div>
</div>
    
</body>
</html>
